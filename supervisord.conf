[supervisord]
nodaemon=true

[program:xvfb]
command=Xvfb :1 -screen 0 1920x1080x24
autorestart=true
priority=1

[program:openbox]
command=openbox
environment=DISPLAY=":1"
autorestart=true
priority=2

[program:orcaslicer]
command=/opt/OrcaSlicer.AppImage --no-sandbox
environment=DISPLAY=":1"
autorestart=true
priority=3

[program:x11vnc]
command=x11vnc -display :1 -nopw -listen localhost -xkb -ncache 10 -ncache_cr -forever
autorestart=true
priority=4

[program:novnc]
command=websockify --web=/usr/share/novnc 8080 localhost:5900
autorestart=true
priority=5
